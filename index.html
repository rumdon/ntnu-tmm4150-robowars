<!-- Basic HTML5 -->
<!DOCTYPE html>
<html>

<head>
    <title>WebBLE</title>
    <meta charset="utf-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style type="text/css">
        :root {
            --slider-thumb-size: 90px;
            --u: min(1px, (100vw - 80px) / 900);
        }

        html,
        body {
            /* background-image: repeating-radial-gradient(#6c3b3b40, transparent 23px); */
            height: 100%;
            margin: 0;
            box-sizing: border-box;
            padding:20px;
            background-color: rgb(113 92 97);;
            /* background-color: rgb(217 212 212); */
        }

        body>button,
        body>div {
            align-self: center;
            justify-self: center;
        }

        .slider-container {
            width: 100%;
            height: var(--slider-thumb-size);
            position: relative;
            align-self: center;
            justify-self: center;
            max-width: 30em;
        }

        .slider-container.vertical {
            width: var(--slider-thumb-size);
            height: 100%;
            max-height: 30em;
        }

        .slider-track {
            width: 100%;
            height: 50%;
            background-color: #eee;
            position: absolute;
            top: 25%;
            border-radius: 5px;
        }

        .vertical .slider-track {
            width: 50%;
            height: 100%;
            top: 0;
            left: 25%;
        }

        .slider-thumb {
            width: var(--slider-thumb-size);
            height: var(--slider-thumb-size);
            background-color: #da7373;
            border-radius: 50%;
            position: absolute;
            top: calc(50% - var(--slider-thumb-size) / 2);
            cursor: pointer;
            /* Initial position of the thumb */
            left: calc(50% - var(--slider-thumb-size) / 2);
            /* Transition slider thumb position */
        }

        pre {
            box-sizing: border-box;
            margin: 0;
            /* height: 100%; */
            padding: 1em;
            overflow: auto;
            /* height: 100%; */
            border: 1px dashed gray;
            border-radius: 0.5em;
            height: 30vh;
            width: 100%;
            overflow-y: scroll;
        }
        .contentCon{
            display: grid;
            grid-template-columns: 11fr 1fr;
            column-gap: 5px;
            flex-direction: column;
            align-content: center;
            justify-content: center;
            align-items: center;
            /* width: 100vw; */
            border: 19px ridge #2828282b;
            /* height: 80%; */
            margin: -30px;
            border-radius: 5px;
            background-color: rgb(42 42 42);
            background-image: repeating-linear-gradient(55deg, #000000, transparent 6px);
            z-index: 9999;
        }
        .logCon{
            width: 80%;
            /* display: flex; */
            display: grid;
            grid-template-columns: auto auto;
            /* margin-left: 20%; */
            /* padding-right: 20%; */
            gap: 5px;
            padding-top: 50px;
            /* height:65vh; */
        }
        .bodyCon{
            max-width: 100vw;
            width: 900px;
            align-items:center;
    height: 100%;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
        }
        .terminal{
            height: 400px;
    border: 8px ridge #00000069;
    border-style: ridge;
    background-color: #071e02;
    color: #32ed32e8;
    font-size: xxx-large;
    font-family: monospace;
    font-weight: 100;
    text-shadow: 1px -1px 20px #ebff819c;
    padding: 50px;
    margin: 25px;
    box-shadow: inset 0px 0px 40px 13px #456b302b;
        }
        .batteryCon{

            --pip: 5;
            
            height: 85%;
            /* height: 130%; */
    /* width: 180px; */
    width: 50px;
    border: 9px ridge #04090e78;
    border-radius: 20px;
    background-color: #000716;
    box-shadow: inset 0px 0px 40px 13px #0cbcff40;
    display: flex;
    flex-direction: column;
    flex-wrap: nowrap;
    align-content: center;
    justify-content: space-evenly;
    align-items: center;
    margin-right:20px;
        }
        .batteryCon>div:nth-child(1){--nth-child:1}
        .batteryCon>div:nth-child(2){--nth-child:2}
        .batteryCon>div:nth-child(3){--nth-child:3}
        .batteryCon>div:nth-child(4){--nth-child:4}
        .batteryCon>div:nth-child(5){--nth-child:5}
        .batteryCon>div{
            --anim:linear(-0.0 5.88%, -0.0 21.25%, 1.26 21.25%, 0.98 34.49%, 0.97 66.85%, 0.1 66.85%, 0.01 81.55%, -0.0 100%);
            --if: if(
                style(var(--nth-child) = var(--pip)): var(--anim);
                style(var(--nth-child) < var(--pip)): steps(1,end);
                else: steps(1,start);
            );

            z-index: 99;
            width: 65%;
            height: 15%;
            
            background-color: #d8faff;
            border-radius: 18px;
            box-shadow: 0px 0px 18px 6px #00b9ff;
            animation-name: batBlink;
            animation: batBlink 2s linear infinite;
            animation-timing-function: var(--if)  !important;
            animation-delay: -1.0s;
            /* animation-timing-function:  if(style(var(--nth-child) < var(--pips)): var(--anim); else: steps(1,start)) !important; */

        }
        @keyframes batBlink {
            0%{
                opacity: 20%;
                box-shadow: none;
                filter:blur(4px);
            }
            100%{
                opacity: inherit;
                filter:blur(1px);
            }
        }


        #message{
            margin-top:10px;
        }
        .bodyCon>div{
            box-shadow: 10px 9px 20px 4px rgb(0 0 0 / 25%);
        }



        .tread{
            width: 130px;
    height: 700px;
    overflow: hidden;
    border-radius: 30px;
    position: relative;
    min-width: 130px;

        }
        /* #message::after{
            conte
        } */
        .tread>div{
            --deg: 15deg;
            --speed:0;
            --clamped-speed: calc(max(min(var(--speed),255),-255)/255);
            height:200%;
            width: 100%;
            /* background-image: repeating-linear-gradient(45deg, black, transparent 100px); */
            /* background-image: repeating-linear-gradient(0deg, black, gray calc(50px + 25px * var(--clamped-speed)), black 100px); */
            background-image: repeating-linear-gradient(calc(var(--clamped-speed) * var(--deg)), #150000, #6d5e5e calc(30px + 15px * var(--clamped-speed)), #150000 60px);
            /* background-image: repeating-linear-gradient(0deg, black, gray 50px, black calc(100px + 75px* abs(var(--clamped-speed)))); */
            transform: translateY(calc(var(--offset)*100%));
            /* filter:blur(calc(var(--scalar-speed)*2px - 1px)); */
            /* filter:blur(calc(var(--scalar-speed)*1px)); */
                /* transition:transform calc(0.1s); */
        }
        .tread::after {
        content: "";
        position: absolute;
        inset: 0; /* Shorthand for top: 0; right: 0; bottom: 0; left: 0; */
        /* box-shadow: inset 0px 0px 12px 7px rgb(167 151 145 / 75%); */
        box-shadow: inset 0px 0px 20px 11px rgb(0 0 0 / 75%);
        border-radius: inherit; /* Matches parent's rounded corners, if any */
        pointer-events: none; /* Crucial: lets clicks pass through to children */
        z-index: 1;
        }
        :root {
    /* 1px at 900px content width, smaller below that (40px = body padding) */
    /* --u: min(1px, (100vw - 40px) / 900); */
    --slider-thumb-size: calc(90 * var(--u));
}

.contentCon {
    border: calc(19 * var(--u)) ridge #2828282b;
    margin: calc(-60 * var(--u));
    /* min-width: 0; */
}

.logCon {
    padding-top: calc(50 * var(--u));
}

.bodyCon {
    width: calc(900 * var(--u));
    justify-content: center;
}

.terminal {
    height: calc(400 * var(--u));
    border: calc(8 * var(--u)) ridge #00000069;
    font-size: calc(44 * var(--u)); /* xxx-large = 48px */
    padding: calc(50 * var(--u));
    margin: calc(25 * var(--u));
}

.batteryCon {
    width: calc(50 * var(--u));
    border: calc(9 * var(--u)) ridge #04090e78;
    border-radius: calc(20 * var(--u));
    margin-right: calc(20 * var(--u));
}

.tread {
    width: calc(130 * var(--u));
    min-width: calc(130 * var(--u));
    height: calc(700 * var(--u));
    border-radius: calc(30 * var(--u));
}

.tread>div {
    background-image: repeating-linear-gradient(calc(var(--clamped-speed) * var(--deg)), #150000, #6d5e5e calc(30 * var(--u) + 15 * var(--u) * var(--clamped-speed)), #150000 calc(60 * var(--u)));
}
    .batteryCon>div{
        animation-timing-function: steps(1,start) !important;
    }
    @container style(--pip: 1) {
    .batteryCon>div:nth-child(1) { animation-timing-function: var(--anim) !important; }
}
@container style(--pip: 2) {
    .batteryCon>div:nth-child(-n+1) { animation-timing-function: steps(1,end) !important; }
    .batteryCon>div:nth-child(2) { animation-timing-function: var(--anim) !important; }
}
@container style(--pip: 3) {
    .batteryCon>div:nth-child(-n+2) { animation-timing-function: steps(1,end) !important; }
    .batteryCon>div:nth-child(3) { animation-timing-function: var(--anim) !important; }
}
@container style(--pip: 4) {
    .batteryCon>div:nth-child(-n+3) { animation-timing-function: steps(1,end) !important; }
    .batteryCon>div:nth-child(4) { animation-timing-function: var(--anim) !important; }
}
@container style(--pip: 5) {
    .batteryCon>div:nth-child(-n+4) { animation-timing-function: steps(1,end) !important; }
    .batteryCon>div:nth-child(5) { animation-timing-function: var(--anim) !important; }
}
@container style(--pip: 6) {
    .batteryCon>div:nth-child(-n+5) { animation-timing-function: steps(1,end) !important; }
}
.contentCon {
    flex: 1 1 0;
    min-width: 0;
    grid-template-columns: minmax(0, 11fr) 1fr;
}

.terminal {
    overflow-wrap: anywhere;
    overflow-y: hidden;
    display: flex;
    flex-direction: column;
    flex-wrap: nowrap;
    align-items: flex-start;
    justify-content: flex-end;
}
.terminal::after {
    content: "";
    flex-grow: 1;
}
    </style>
</head>

<body
    >
    <div class="bodyCon">
        <div class="tread">
            <div id="tread_inner_left" style="--tread-speed: 50;"></div>
        </div>
        <div class="contentCon">
            <div class="terminal">
                <div id="charge">charge: –</div>
                <div id="speed_left">speed_left: –</div>
                <div id="speed_right">speed_right: –</div>
                <div id="servo">servo: –</div>
                <div id="message">message: –</div>
            </div>
            <div class="batteryCon" id="battery">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
        <div class="tread">
            <div id="tread_inner_right" style="--tread-speed: 255"></div>
        </div>
    </div>



<script>
const API = "https://rundominium.asuscomm.com/api/telemetry";
const keys = ["charge", "speed_left", "speed_right", "servo","message"];
const tread_keys = ["speed_left","speed_right"];
let latest_d = {
    "charge": 12.3,
    "speed_left": 200,
    "speed_right": -25,
    "servo": 0,
    "message": "",
};
const Hz = 30;
const max_tread_speed = 1.2; //seconds
const offset_scalar = 1/(max_tread_speed*255*Hz);

let tread_offset_left = 0;
let tread_offset_right = 0;

function charge_to_pip(x){
    x = Math.min(13,x);
    x = Math.max(11.5,x);
    x -=11.5;
    x /=12.8-11.5;
    return 6 - Math.floor(5*x + 0.18);
}

function val_to_offset_shift(x){
    x = Math.max(x,-255);
    x = Math.min(x,255);
    return 0.5 * x * offset_scalar;
}
const mod = (n, m) => ((n % m) + m) % m;

let terminal_counter = 0;
let l_speed = 0;
let r_speed = 0
let mix_const = 0.5
setInterval(()=>{
    l_speed = mix_const*l_speed + (1-mix_const)*latest_d.speed_left;
    r_speed = mix_const*r_speed + (1-mix_const)*latest_d.speed_right;

    tread_offset_left = mod(tread_offset_left + val_to_offset_shift(l_speed),0.5);
    tread_offset_right = mod(tread_offset_right + val_to_offset_shift(r_speed),0.5);


    document.getElementById("tread_inner_left").style="--deg: -10deg; --offset: " + (-tread_offset_left).toString() +"; filter: blur(" + (Math.abs(latest_d.speed_left)/64 -2).toString() + "px); --speed: " + latest_d.speed_left.toString();
    document.getElementById("tread_inner_right").style="--deg: 10deg; --offset: " + (-tread_offset_right).toString() +"; filter: blur(" + (Math.abs(latest_d.speed_right)/64 -2).toString() + "px); --speed: " + latest_d.speed_right.toString();

    document.getElementById("battery").style="--pip: " + charge_to_pip(latest_d.charge).toString();
    
},1000/Hz);

setInterval(async () => {
    latest_d.speed_left +=5;    
    latest_d.speed_left = (latest_d.speed_left + 256)%511 - 256;
    // latest_d.speed_left = mod(latest_d.speed_left,255);


  try {
    const d = await (await fetch(API, { cache: "no-store" })).json();
    for (const k of keys) {
        // if(d[k] !== undefined){
        //     if(k in tread_keys){
                
        //     }else{
        //         document.getElementById(k).textContent = `${k}: ${d[k]}`
        //     }
        // }
        if(k == "message"){
            let extra_string = "";
            if(terminal_counter%16 > 7){
                extra_string = "_"
            }
            if (d[k] !== undefined) document.getElementById(k).textContent = "#" + `${k}: ${d[k]}` + extra_string;

        }else if(k=="charge"){
            if (d[k] !== undefined) document.getElementById(k).textContent =  "#" + `${k}: ${d[k].toFixed(2)}`+ "V";
        }else if(k=="servo"){
            if (d[k] !== undefined) document.getElementById(k).textContent =  "#" + `${k}: ${d[k].toFixed(0)}`+ "°";
        }else{
            if (d[k] !== undefined) document.getElementById(k).textContent =  "#" + `${k}: ${d[k].toFixed(0)}`;
        }
      if (d[k] !== undefined) latest_d[k] = d[k];
    }
  } catch (e) { /* server unreachable */ }
  terminal_counter++;
}, 100);
</script>

</html>
