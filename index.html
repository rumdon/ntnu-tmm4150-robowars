<!-- Basic HTML5 -->
<!DOCTYPE html>
<html>

<head>
    <title>WebBLE</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


    <style type="text/css">
        :root {
            --slider-thumb-size: 90px;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            box-sizing: border-box;
        }

        body>button,
        body>div {
            align-self: center;
            justify-self: center;
        }

        .slider-container {
            width: 100%;
            height: var(--slider-thumb-size);
            position: relative;
            align-self: center;
            justify-self: center;
            max-width: 30em;
        }

        .slider-container.vertical {
            width: var(--slider-thumb-size);
            height: 100%;
            max-height: 30em;
        }

        .slider-track {
            width: 100%;
            height: 50%;
            background-color: #eee;
            position: absolute;
            top: 25%;
            border-radius: 5px;
        }

        .vertical .slider-track {
            width: 50%;
            height: 100%;
            top: 0;
            left: 25%;
        }

        .slider-thumb {
            width: var(--slider-thumb-size);
            height: var(--slider-thumb-size);
            background-color: #da7373;
            border-radius: 50%;
            position: absolute;
            top: calc(50% - var(--slider-thumb-size) / 2);
            cursor: pointer;
            /* Initial position of the thumb */
            left: calc(50% - var(--slider-thumb-size) / 2);
            /* Transition slider thumb position */
        }

        pre {
            box-sizing: border-box;
            margin: 0;
            /* height: 100%; */
            padding: 1em;
            overflow: auto;
            /* height: 100%; */
            border: 1px dashed gray;
            border-radius: 0.5em;
            height: 30vh;
            width: 100%;
            overflow-y: scroll;
        }
        .contentCon{
            display: flex;
            flex-direction: column;
            align-content: center;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100%;
        }
        .logCon{
            width: 80%;
            /* display: flex; */
            display: grid;
            grid-template-columns: auto auto;
            /* margin-left: 20%; */
            /* padding-right: 20%; */
            gap: 5px;
            padding-top: 50px;
            /* height:65vh; */
        }
    </style>
</head>

<body
    style="display: grid; grid-template-columns: 1fr 1.5fr; grid-template-rows: 1fr 3fr; grid-gap: 1em; padding: 1em;">
    <div class="contentCon"><div id="charge">charge: –</div>
<div id="speed_left">speed_left: –</div>
<div id="speed_right">speed_right: –</div>
<div id="servo">servo: –</div>

<script>
const API = "https://rundominium.asuscomm.com/api/telemetry";
const keys = ["charge", "speed_left", "speed_right", "servo"];

setInterval(async () => {
  try {
    const d = await (await fetch(API, { cache: "no-store" })).json();
    for (const k of keys) {
      if (d[k] !== undefined) document.getElementById(k).textContent = `${k}: ${d[k]}`;
    }
  } catch (e) { /* server unreachable */ }
}, 100);
</script>

</html>
